      { challenge: "Véndenle los ojos a su pareja y átenle las manos con cuidado, guiando cada movimiento solo con la voz.", product: 'bondage-inicial' },
      { challenge: "Practiquen un bondage ligero solo en un brazo, dejando el resto del cuerpo libre para explorar distintas sensaciones.", product: 'bondage-inicial' },
      { challenge: "Denle a su pareja el control total de cuándo empezar y terminar el bondage de la sesión.", product: 'bondage-inicial' },
      { challenge: "Terminen la sesión de bondage desatando muy despacio, con un masaje relajante en las muñecas y los brazos.", product: 'bondage-inicial' },
      { challenge: "Prueben juntos algo nuevo para los dos, paso a paso y sin prisa, hablando después de cada nuevo paso sobre cómo se sintió.", product: 'primera-vez' },
      { challenge: "Anímense a probar algo que nunca hayan hecho juntos, dedicando toda la sesión a explorarlo con calma.", product: 'primera-vez' },
      { challenge: "Estrenen juntos algo nuevo, sin instrucciones previas, y descubran cómo disfrutarlo a su manera, comunicándose todo el tiempo.", product: 'primera-vez' },
      { challenge: "Cierren la noche de su primera vez juntos contándose qué fue lo que más les gustó y qué repetirían la próxima vez.", product: 'primera-vez' }
    ];

    let playCount = 0;
    let currentIndex = null;
    let bag = []; let customChallenges = []; const RANDOM_DISCOUNTS = [5, 10, 15, 20]; const FREE_SHIPPING_AFTER = 80; const FREE_SHIPPING_MIN_ORDER = '$70.000'; function getPromoHTML() { if (playCount >= FREE_SHIPPING_AFTER) { return '<div class="discount-badge">🚚 ¡Envio GRATIS! <small>(Pedido minimo ' + FREE_SHIPPING_MIN_ORDER + ')</small></div>'; } const d = RANDOM_DISCOUNTS[Math.floor(Math.random() * RANDOM_DISCOUNTS.length)]; return '<div class="discount-badge">🎉 ' + d + '% de descuento</div>'; }

    function loadCustomChallenges() {
      try {
        const raw = localStorage.getItem(CUSTOM_KEY);
        customChallenges = raw ? JSON.parse(raw) : [];
      } catch (e) {
        customChallenges = [];
      }
      customChallenges.forEach((text, i) => {
        const input = document.getElementById('custom' + (i + 1));
        if (input) input.value = text;
      });
    }

    function saveCustomChallenges() {
      const values = [1, 2, 3, 4]
        .map(n => document.getElementById('custom' + n).value.trim())
        .filter(v => v.length > 0);

      customChallenges = values;
      try {
        localStorage.setItem(CUSTOM_KEY, JSON.stringify(values));
      } catch (e) {
        // almacenamiento no disponible en este navegador, se ignora
      }

      refillBag();

      const msg = document.getElementById('saveMsg');
      msg.textContent = '✓ Guardado';
      setTimeout(() => { msg.textContent = ''; }, 2500);
    }

    function toggleCustomPanel() {
      const panel = document.getElementById('customPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function getPool() {
      return challenges.concat(customChallenges.map(text => ({ challenge: text, product: null })));
    }

    function refillBag() {
      const pool = getPool();
      bag = pool.map((_, i) => i);
      // baraja el mazo
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }

    function pickChallenge() {
      const pool = getPool();
      if (bag.length === 0) refillBag();
      let idx = bag.pop();
      if (idx === currentIndex && bag.length > 0) {
        const swapIdx = bag.pop();
        bag.push(idx);
        idx = swapIdx;
      }
      currentIndex = idx;
      return pool[idx];
    }

    function showChallenge(item) {
      const card = document.getElementById('challengeCard');
      card.classList.remove('fade');
      void card.offsetWidth;
      card.classList.add('fade');

      document.getElementById('challengeText').textContent = item.challenge;

      playCount++;
      document.getElementById('counter').textContent = `Reto #${playCount}`;

      const suggestionDiv = document.getElementById('productSuggestion');
      if (playCount % 5 === 0) {
        suggestionDiv.style.display = 'block';
        const product = item.product ? productLinks[item.product] : null;
        suggestionDiv.innerHTML = product
          ? `
          <h4>🎁 Sugerencia de producto (opcional)</h4>
          <div class="product-item">${product.name} ${getPromoHTML()}</div>
          <button class="add-cart-btn" onclick="window.open('${product.url}', '_blank')">Ver sugerencia</button>
          <div class="catalog-line">
            <button class="catalog-btn" onclick="window.open('${CATALOG_URL}', '_blank')">📖 Ver catálogo completo en multiproductos.pro</button>
          </div>
        `
          : `
          <h4>🎁 ¿Quieren llevar el juego más lejos?</h4>
          <div class="catalog-line">
            <button class="catalog-btn" onclick="window.open('${CATALOG_URL}', '_blank')">📖 Ver catálogo completo en multiproductos.pro</button>
          </div>
        `;
      } else {
        suggestionDiv.style.display = 'none';
        suggestionDiv.innerHTML = '';
      }
    }

    function nextChallenge() {
      showChallenge(pickChallenge());
    }

    loadCustomChallenges();
    showChallenge(pickChallenge());
  </script>
</body>
</html>
